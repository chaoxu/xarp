name: Check
on: [push, pull_request]
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:package
      - uses: browser-actions/setup-chrome@v2
        if: runner.os == 'Linux'
        id: chrome
      - run: npm run test:browser
        env:
          XARP_TEST_CHROME: ${{ runner.os == 'Linux' && steps.chrome.outputs.chrome-path || '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-${{ matrix.os }}-${{ matrix.node }}
          path: output/browser/
